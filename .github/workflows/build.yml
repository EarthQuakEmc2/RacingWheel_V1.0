name: Build

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests and free release APK
        run: chmod +x ./gradlew && ./gradlew :app:testFreeDebugUnitTest :app:assembleFreeRelease --stacktrace

  pc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test pc/RacingWheelPro.PC.Tests/RacingWheelPro.PC.Tests.csproj -c Release

      - name: Publish Windows receiver
        run: >-
          dotnet publish pc/RacingWheelPro.PC.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o pc/publish
