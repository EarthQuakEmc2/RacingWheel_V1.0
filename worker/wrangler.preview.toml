# Temporary preview only. No custom domain, no production D1.
# Deploy with: npx wrangler deploy --temporary --config wrangler.preview.toml
name = "racingwheel-pro-preview"
main = "src/index.ts"
compatibility_date = "2025-11-01"
workers_dev = true

[assets]
directory = "../website/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
