name = "racingwheel-pro"
main = "src/index.ts"
compatibility_date = "2025-11-01"
workers_dev = false

# Static site built by website/ (`npm run build`). API paths hit this module;
# everything else is the existing Vite site, with SPA fallback for /account,
# /session/:id and /leaderboard. Custom domains are attached in the dashboard,
# so this file does not declare routes.

[assets]
directory = "../website/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "racingwheel-pro"
database_id = "00000000-0000-0000-0000-000000000000"

[ai]
binding = "AI"

# Steering Packages are not deployed with this worker. Do not set LICENCE_MODE
# or payment secrets on racingwheel-pro until the owner launches the draft.
# Local sandbox: copy worker/.dev.vars.example to worker/.dev.vars.
