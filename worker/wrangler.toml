name = "racingwheel-pro"
main = "src/index.ts"
compatibility_date = "2025-11-01"
workers_dev = false

# Static site built by website/ (`npm run build`). API paths hit this module;
# everything else is the existing Vite site, with SPA fallback for /account,
# /session/:id and /leaderboard. Custom domains are attached in the dashboard,
# so this file does not declare routes.

[assets]
directory = "../website/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "racingwheel-pro"
database_id = "00000000-0000-0000-0000-000000000000"

[ai]
binding = "AI"

# Push-to-talk rooms. SQLite-backed so the class is allowed on the Workers Free
# plan. The class does not write rows; audio is forwarded and dropped.
[[durable_objects.bindings]]
name = "VOICE_ROOMS"
class_name = "VoiceRoom"

[[migrations]]
tag = "v1-voice"
new_sqlite_classes = ["VoiceRoom"]
